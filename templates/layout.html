{{define "layout"}}<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · Events</title>
<style>
:root{--bg:#1a1b1e;--panel:#25262b;--line:#33353b;--ink:#e8e9ed;--dim:#9a9ca3;
      --accent:#5865f2;--ok:#2eb872;--warn:#e8a33d;--bad:#e05260}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:#9aa4ff;text-decoration:none}a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;
       align-items:center;gap:14px;background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
header .spacer{flex:1}
main{max-width:900px;margin:0 auto;padding:26px 20px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--dim);font-size:13px}
.row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;
      border:1px solid var(--line);color:var(--dim)}
.pill.open{color:var(--ok);border-color:#2eb87255}
.pill.closed{color:var(--warn);border-color:#e8a33d55}
.pill.cancelled{color:var(--bad);border-color:#e0526055}
.pill.completed{color:var(--dim)}
/* Home page cards: one link each, date block, what and where, and how full. */
a.event-card{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;
  transition:border-color .12s,background .12s,transform .12s}
a.event-card:hover{border-color:#5865f288;background:#292a30;text-decoration:none}
a.event-card:hover .chev{color:var(--ink);transform:translateX(2px)}
a.event-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.datebox{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#1b1c20;border:1px solid var(--line);border-radius:10px;padding:6px 0;line-height:1.1}
.datebox.none{font-size:11px;color:var(--dim);height:62px}
.db-dow,.db-mon{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
.db-day{font-size:22px;font-weight:700;margin:1px 0}
.ec-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ec-title{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec-meta{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec-meta .dot{margin:0 6px}
.ec-tags{display:flex;gap:6px;flex-wrap:wrap}
.ec-tags:empty{display:none}
.ec-count{flex:none;width:112px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ec-num{font-size:18px;font-variant-numeric:tabular-nums}
.ec-sub{font-size:12px;color:var(--dim);text-align:right}
.bar{display:flex;width:100%;height:5px;background:#1b1c20;border-radius:99px;overflow:hidden}
.bar-going{background:var(--ok)}
.bar-held{background:#5865f2aa}
.chev{flex:none;color:var(--dim);transition:transform .12s}
@media (max-width:560px){
  a.event-card{flex-wrap:wrap;gap:12px}
  .ec-count{width:auto;flex-direction:row;align-items:center;gap:10px;order:3;flex-basis:100%;padding-left:70px}
  .ec-count .bar{flex:1}
  .chev{display:none}
}
/* Archived cards stay legible but visibly done — dimmed, not hidden, because
   the roster of a past event is exactly what gets looked up later. */
.card.faded,a.event-card.faded{opacity:.62}
.card.faded:hover,a.event-card.faded:hover{opacity:1}
details.archive{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
details.archive summary{cursor:pointer;color:var(--dim);font-size:14px;
  list-style:none;user-select:none;padding:6px 0}
details.archive summary::-webkit-details-marker{display:none}
details.archive summary::before{content:"▸ ";color:var(--dim)}
details.archive[open] summary::before{content:"▾ "}
details.archive summary:hover{color:var(--ink)}
.pill.discord{color:#9aa4ff;border-color:#5865f255}
label{display:block;margin:14px 0 5px;font-size:13px;color:var(--dim)}
input,select,textarea{width:100%;background:#1e1f23;border:1px solid var(--line);
      color:var(--ink);border-radius:7px;padding:9px 11px;font:inherit}
textarea{min-height:80px;resize:vertical}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;
      padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
button.ghost,.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.danger{background:transparent;border:1px solid #e0526055;color:var(--bad)}
button:hover{filter:brightness(1.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.hint{color:var(--dim);font-size:12px;margin-top:5px}
.err{background:#e0526018;border:1px solid #e0526055;color:#ffb3bb;
     padding:11px 14px;border-radius:8px;margin-bottom:16px}
.ok{background:#2eb87218;border:1px solid #2eb87255;color:#a5e8c4;
    padding:11px 14px;border-radius:8px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--dim)}
.count{font-variant-numeric:tabular-nums}
.picker{position:absolute;left:0;right:0;top:100%;z-index:5;margin:2px 0 0;padding:4px 0;
  list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  max-height:280px;overflow-y:auto}
.picker li{padding:6px 10px;cursor:pointer}
.picker li:hover,.picker li[aria-selected="true"]{background:var(--line)}
.picker li.note{cursor:default;color:var(--dim)}
/* A short name with the Discord name behind it. The caret says it opens;
   the box floats over the page rather than widening a column. */
details.aka{display:inline-block;position:relative}
details.aka summary{display:inline-flex;align-items:center;gap:3px;cursor:pointer;list-style:none;
  border-bottom:1px dotted var(--dim);line-height:1.3}
details.aka summary::-webkit-details-marker{display:none}
details.aka summary:hover{color:#fff;border-bottom-color:var(--ink)}
details.aka .caret{width:10px;height:10px;color:var(--dim);transition:transform .15s}
details.aka[open] .caret{transform:rotate(180deg)}
.aka-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;min-width:160px;max-width:260px;
  background:#2f3136;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  box-shadow:0 8px 24px #0007;font-size:13px;white-space:normal}
.aka-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:2px}
.bad{color:var(--bad)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
/* A wide table scrolls inside its card on a phone rather than pushing the
   whole page sideways. */
.table-scroll{overflow-x:auto}

/* The event page: the event and its people on the left, its controls and
   Discord's side of it on the right. */
main:has(.event-layout){max-width:1140px}
.event-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.event-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.event-side .card{margin:0}
/* On a phone it is one column: the event, then its controls, then the
   people, with Discord's side of it last. minmax(0,1fr), not 1fr, or a wide
   table stretches the column past the screen. */
@media (max-width:900px){
  .event-layout{display:flex;flex-direction:column;align-items:stretch;gap:14px}
  .event-main,.event-side{display:contents}
  .event-layout .card{margin:0;min-width:0;max-width:100%}
  .event-head{order:1}.side-card:not(.info){order:2}.event-main>.card:not(.event-head){order:3}.side-card.info{order:4}
}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card-head h3{margin:0}
.sub-head{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.badge{font-size:12px;font-variant-numeric:tabular-nums;background:var(--line);color:var(--ink);
  border-radius:999px;padding:1px 9px}
.empty{color:var(--dim);font-size:14px;margin:6px 0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.pill.bad-pill{color:var(--bad);border-color:#e0526055}

/* Fields: read as text, with a pencil to edit one in place. */
.title-row{display:flex;align-items:center;gap:8px}
.title-row h2{margin:0;font-size:22px;line-height:1.25}
.title-input{font-size:20px;font-weight:600}
.facts{margin:14px 0 0;display:flex;flex-direction:column}
.facts .field{display:grid;grid-template-columns:92px minmax(0,1fr);gap:0 12px;padding:9px 0;border-top:1px solid #2d2f35}
.facts dt{color:var(--dim);font-size:13px;padding-top:2px}
.facts dd{margin:0;grid-column:2}
.field-view{display:flex;align-items:flex-start;gap:8px}
.field-view > span:first-child{flex:0 1 auto}
.field-view .sub{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.prose{white-space:pre-wrap}
.field.editing > .field-view, .field.editing dd.field-view{display:none}
.icon-btn{background:transparent;border:1px solid transparent;color:var(--dim);border-radius:6px;
  width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--line);color:var(--ink);filter:none}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.icon-btn.edit{opacity:.55;margin-top:-3px}
.field:hover .icon-btn.edit,.icon-btn.edit:focus-visible{opacity:1}
@media (hover:none){.icon-btn.edit{opacity:1}}
.icon-btn.ok{color:var(--ok);border-color:#2eb87255}
.icon-btn.ok:hover{background:#2eb87222;color:var(--ok)}
.field-edit label{margin:0;font-size:12px}
.field-edit label input,.field-edit label select{margin-top:4px}
.editbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.editbar .icon-btn{border-color:var(--line);margin:0}
.editbar form,.editbar > *{vertical-align:middle}
.field-error{color:var(--bad);font-size:13px;margin-left:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:600px){.grid3,.grid2{grid-template-columns:1fr}}
input.narrow,select.narrow{max-width:260px}

/* People lists. */
ol.people{list-style:none;margin:4px 0 0;padding:0}
.person{display:flex;align-items:center;gap:6px 12px;padding:9px 0;border-bottom:1px solid #2d2f35;flex-wrap:wrap}
.person-main{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:1px}
.person-main .when{font-size:12px}
.person-main .who{flex:none}
.person:last-child{border-bottom:0}
.place{flex:none;min-width:30px;text-align:center;font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
.place.wait{background:#e8a33d1f;color:var(--warn);border-radius:6px;padding:2px 6px;font-weight:600}
.who{flex:1 1 140px;min-width:0}
.when{color:var(--dim);font-size:12px}
.row-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.row-actions form{margin:0}
.mover{display:inline-flex;border:1px solid var(--line);border-radius:7px}
.mover form{display:inline-flex}
.mover .icon-btn{border-radius:0;width:26px;height:26px}
.btn-sm{font-size:13px;padding:4px 10px;border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn-sm.danger{border-color:#e0526044;color:var(--bad)}
.btn-sm:hover{background:var(--line);filter:none}
.btn-sm.danger:hover{background:#e0526018}

/* Add someone: one person, two clearly different ways in. */
.picker-wrap{position:relative;margin:8px 0 6px}
.picker-wrap.search .member-name{padding-left:34px}
.search-icon{position:absolute;left:11px;top:12px;color:var(--dim);pointer-events:none}
.picked-list{list-style:none;margin:10px 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.picked-list:empty{display:none}
.picked-person{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;
  border:1px solid #5865f266;background:#5865f214;border-radius:10px}
.picked-text{flex:1;min-width:0}
.picked-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.picked-sub{color:var(--dim);font-size:13px}
.avatar{flex:none;width:32px;height:32px;font-size:14px;border-radius:50%;background:#5865f2;color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-weight:600;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
/* Unavailable reads as unavailable, the same on both panels. */
.choice > button:disabled,.seg:disabled{background:repeating-linear-gradient(135deg,transparent 0 6px,#ffffff08 6px 12px);
  color:#6b6e76;border-color:var(--line);opacity:1;cursor:not-allowed;filter:none;
  text-decoration:line-through;text-decoration-color:#8a8d94;text-decoration-thickness:1.5px}
.choice > button:disabled{border:1px solid var(--line)}
.choice-note{margin:10px 0 0;font-size:12px;color:var(--dim)}
/* An option tile: the whole tile is the checkbox. On, it lights in its
   panel's colour and the box fills with a tick. */
label.tile{position:relative;display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;
  border:1px solid var(--line);border-radius:9px;background:#1b1c20;cursor:pointer;
  color:var(--ink);font-size:14px;transition:border-color .12s,background .12s,box-shadow .12s}
label.tile input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
label.tile:hover{border-color:#5865f288}
.tile-box{flex:none;width:18px;height:18px;margin-top:1px;border:1.5px solid #6b6e76;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.tile-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-text > span{color:var(--dim);font-size:12.5px;line-height:1.45}
.tile-warn{color:var(--warn)!important}
label.tile:has(input:checked){border-color:var(--accent);background:#5865f21f;box-shadow:0 0 0 1px #5865f255 inset}
label.tile:has(input:checked) .tile-box{background:var(--accent);border-color:var(--accent)}
label.tile:has(input:checked) .tile-box::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px)}
label.tile:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
label.tile:has(input:disabled){opacity:.45;cursor:not-allowed}
label.force-tile:hover{border-color:#e8a33d88}
label.force-tile:has(input:checked){border-color:var(--warn);background:#e8a33d1a;box-shadow:0 0 0 1px #e8a33d44 inset}
label.force-tile:has(input:checked) .tile-box{background:var(--warn);border-color:var(--warn)}
.choice-what{flex:none!important}
.choice-foot{margin-top:auto;padding-top:4px}
.regular-mark{color:#9aa4ff;vertical-align:-1px}
.btn-sm.regular-toggle{display:inline-flex;align-items:center;gap:4px}
.btn-sm.regular-toggle.is-on{color:#9aa4ff;border-color:#5865f266;background:#5865f214}
.regulars-away{font-size:13px;color:var(--ink);margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.pill.held{color:#9aa4ff;border-color:#5865f266}
.control.is-off h4{opacity:.6}
.map-link{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:13px}
.location-row{display:flex;gap:8px;align-items:center}
.location-row input{flex:1}
.map-search{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;text-decoration:none!important;padding:8px 11px}
.map-preview{display:block;width:100%;height:220px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#1b1c20}
@media (max-width:600px){.location-row{flex-direction:column;align-items:stretch}.map-search{justify-content:center}}
.ask-text{margin:0;font-size:15px;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.choices{grid-template-columns:1fr}}
.choice{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#1f2024}
.choice p{margin:0;font-size:13px;color:var(--dim)}
.choice p strong{color:var(--ink)}
.choice-title{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-weight:600}
.choice.force{border-color:#e8a33d55;background:linear-gradient(180deg,#e8a33d0f,transparent 70%)}
.choice.force .choice-title{color:var(--warn)}
.tag{font-size:12px;font-weight:500;color:var(--warn);border:1px solid #e8a33d55;border-radius:999px;padding:0 7px}
.choice > button{align-self:flex-start}
.segmented{display:flex;border:1px solid #e8a33d66;border-radius:8px;overflow:hidden;align-self:flex-start}
.seg{background:transparent;color:var(--ink);border:0;border-radius:0;padding:7px 14px;font-size:14px}
.seg + .seg{border-left:1px solid #e8a33d44}
.seg:hover{background:#e8a33d22;filter:none}
.seg:disabled{color:var(--dim);cursor:not-allowed;background:transparent}

/* The side column. */
.side-card h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:600}
.side-card p{margin:6px 0}
.control{margin:0 0 16px}
.control h4{margin:0 0 7px}
.control .hint{margin-top:6px}
.seg-control{display:flex;gap:3px;padding:3px;background:#1b1c20;border:1px solid var(--line);border-radius:9px}
.seg-control form{flex:1;margin:0}
.seg-control button{width:100%;background:transparent;color:var(--dim);border:1px solid transparent;
  border-radius:7px;padding:6px 8px;font-size:14px;font-weight:500}
.seg-control button:hover{color:var(--ink);background:#2a2c31;filter:none}
.seg-control button[aria-checked="true"]{cursor:default;color:var(--ink);background:#2f3136;box-shadow:0 1px 2px #0006}
.seg-control button[aria-checked="true"][data-tone="ok"]{color:var(--ok);border-color:#2eb87255;background:#2eb8721a}
.seg-control button[aria-checked="true"][data-tone="warn"]{color:var(--warn);border-color:#e8a33d55;background:#e8a33d1a}
.side-actions{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.side-actions form{margin:0}
.btn-block{width:100%;text-align:center}
button.danger.btn-block{border-color:#e0526055}
button.danger:hover{background:#e0526018;filter:none}
details.why summary{cursor:pointer;color:var(--dim)}
details.log-more summary{cursor:pointer}
table.log td{vertical-align:top}
/* On a phone a log line is two lines: when, then who, what and by. A
   four-column table with a timestamp in it does not fit 390 pixels. */
@media (max-width:600px){
  table.log,table.log tbody{display:block}
  table.log tr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
  table.log td{border:0;padding:0}
  table.log td:first-child{grid-column:1 / -1;font-size:12px}
  table.log td:nth-child(4){grid-column:1 / -1;font-size:12px}
}

/* Phones. Field labels go above their values, lists get room to breathe,
   and nothing a thumb needs is under 40 pixels. */
.form-actions{display:flex;gap:10px;align-items:center;margin-top:22px}
.count-word{display:none}
@media (max-width:600px){
  main{padding:14px 12px 60px}
  header{padding:10px 12px}
  .card{padding:14px}
  .title-row h2{font-size:20px}
  .facts .field{grid-template-columns:1fr;gap:3px}
  .facts dt{font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .facts dd{grid-column:1}
  .field-view{justify-content:space-between}
  .field-view > span:first-child{flex:1}
  .person .place{min-width:24px}
  .choice-title{font-size:15px}
  .segmented{align-self:stretch}
  .segmented .seg{flex:1}
  a.event-card .ec-title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  a.event-card .ec-meta{white-space:normal}
  /* The names page: one card per person, the box and Save on one line. */
  .names-add > div{flex:1 1 100%}
  .names-add input{max-width:none!important}
  table.names-table,table.names-table tbody{display:block}
  table.names-table tr:first-child{display:none}
  table.names-table tr{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  table.names-table td{border:0;padding:0}
  table.names-table td:nth-child(2){grid-column:1 / -1;order:3}
  table.names-table td.count{color:var(--dim);font-size:13px}
  table.names-table .count-word{display:inline}
  table.names-table form.row{flex-wrap:nowrap}
  table.names-table form input{max-width:none!important;flex:1}
}
@media (pointer:coarse){

<script>
// Rewrite every server-rendered UTC timestamp into the reader's own timezone.
// Intl.DateTimeFormat with an undefined locale uses the browser's settings, so
// this needs no timezone detection, no cookie and no round trip.
(function () {
  var fmt = new Intl.DateTimeFormat(undefined, {
    weekday: "short", day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", timeZoneName: "short"
  });
  var dow = new Intl.DateTimeFormat(undefined, { weekday: "short" });
  var day = new Intl.DateTimeFormat(undefined, { day: "numeric" });
  var mon = new Intl.DateTimeFormat(undefined, { month: "short" });
  var clock = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  document.querySelectorAll("time.datebox").forEach(function (el) {
    var when = new Date(el.getAttribute("datetime"));
    if (isNaN(when.getTime())) return;
    el.querySelector(".db-dow").textContent = dow.format(when);
    el.querySelector(".db-day").textContent = day.format(when);
    el.querySelector(".db-mon").textContent = mon.format(when);
    el.title = fmt.format(when);
  });
  var short = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  document.querySelectorAll("time.ts-short").forEach(function (el) {
    var when = new Date(el.getAttribute("datetime"));
    if (isNaN(when.getTime())) return;
    el.textContent = short.format(when);
    el.title = fmt.format(when);
  });
  document.querySelectorAll("time.clock").forEach(function (el) {
    var when = new Date(el.getAttribute("datetime"));
    if (!isNaN(when.getTime())) el.textContent = clock.format(when);
  });
  document.querySelectorAll("time.ts").forEach(function (el) {
    var when = new Date(el.getAttribute("datetime"));
    if (isNaN(when.getTime())) return;   // leave the UTC fallback in place
    el.title = "UTC: " + el.getAttribute("datetime");
    el.textContent = fmt.format(when);
  });
})();
</script>
<script>
// Member pickers: a box that searches a server's members by name as you type.
// Any form with data-member-search gets one. Picking a person puts their user
// id in the form's hidden discord_user_id; the id is what is sent, never the
// name, because two members can share one. A pasted id is taken as it is. A
// form with a guild_id field searches the server it names.
document.querySelectorAll("form[data-member-search]").forEach(function (form) {
  var box = form.querySelector(".member-name");
  // A form that collects several people keeps the picker's own id in an
  // unnamed field, and each pick becomes a named one of its own.
  var hidden = form.querySelector("[data-picker-id]") || form.querySelector("input[name=discord_user_id]");
  function picked(id) {
    return Array.prototype.some.call(form.querySelectorAll("input[name=discord_user_id]"),
      function (i) { return id ? i.value === id : !!i.value; });
  }
  var list = form.querySelector(".picker");
  var guild = form.querySelector("[name=guild_id]");
  var base = form.getAttribute("data-member-search");
  var shown = [], active = -1, timer = null, asked = 0;

  function close() { list.hidden = true; box.setAttribute("aria-expanded", "false"); active = -1; }
  // A pick is announced on the form, so a page can show who was picked.
  function pick(m) {
    box.value = m.display_name; hidden.value = m.user_id; close();
    form.dispatchEvent(new CustomEvent("member-picked", { detail: m }));
  }
  function mark() {
    Array.prototype.forEach.call(list.children, function (li, i) {
      li.setAttribute("aria-selected", i === active ? "true" : "false");
    });
  }
  function note(text) {
    list.innerHTML = "";
    var li = document.createElement("li");
    li.className = "note";
    li.textContent = text;
    list.appendChild(li);
    list.hidden = false;
  }
  function render(members) {
    shown = members; active = -1; list.innerHTML = "";
    if (!members.length) { note("Nobody in this server has a name starting with that."); return; }
    members.forEach(function (m) {
      var li = document.createElement("li");
      li.setAttribute("role", "option");
      var name = document.createElement("strong");
      name.textContent = m.display_name;
      li.appendChild(name);
      var extra = document.createElement("span");
      extra.className = "meta";
      extra.textContent = " @" + m.username + (picked(m.user_id) ? " · picked" : "") +
        (m.on_roster ? " · " + ({ attending: "already going", waitlisted: "already on the waitlist",
                                   maybe: "down as maybe", withdrawn: "left this event" }[m.on_roster] || m.on_roster) : "") +
        (m.readable_name ? " · shown as " + m.readable_name : "");
      li.appendChild(extra);
      // mousedown, not click: click fires after the box loses focus and the
      // list has already closed.
      li.addEventListener("mousedown", function (e) { e.preventDefault(); pick(m); });
      list.appendChild(li);
    });
    list.hidden = false;
    box.setAttribute("aria-expanded", "true");
  }
  function search(q) {
    var mine = ++asked;
    var url = base + (base.indexOf("?") < 0 ? "?" : "&") +
      (guild ? "guild_id=" + encodeURIComponent(guild.value) + "&" : "") + "q=" + encodeURIComponent(q);
    fetch(url, { credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
      .then(function (res) {
        if (mine !== asked) return;      // a later keystroke already asked again
        if (!res.ok) { note(res.body.error || "Search failed."); return; }
        render(res.body.members);
      })
      .catch(function (err) { if (mine === asked) note("Search failed: " + err.message); });
  }

  box.addEventListener("input", function () {
    var q = box.value.trim();
    // A pasted snowflake is an id already; there is nothing to look up.
    hidden.value = /^\d{15,21}$/.test(q) ? q : "";
    clearTimeout(timer);
    if (hidden.value) {
      close();
      form.dispatchEvent(new CustomEvent("member-picked", { detail: { user_id: q, pasted: true } }));
      return;
    }
    if (!q) { close(); return; }
    timer = setTimeout(function () { search(q); }, 200);
  });
  box.addEventListener("keydown", function (e) {
    if (list.hidden || !shown.length) return;
    if (e.key === "ArrowDown") { active = Math.min(active + 1, shown.length - 1); mark(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); mark(); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { pick(shown[active]); e.preventDefault(); }
    else if (e.key === "Escape") { close(); }
  });
  box.addEventListener("blur", close);
  if (guild) guild.addEventListener("change", function () { box.value = ""; hidden.value = ""; close(); });
  form.addEventListener("submit", function (e) {
    if (!picked("")) {
      e.preventDefault();
      note("Pick someone from the list first — a name alone could be more than one person.");
    }
  });
});
</script>
<script>
// The event page, in place. A pencil turns one field into its inputs; Enter
// saves (Ctrl+Enter in a text box), Esc puts it back. Any form marked
// data-async is sent by fetch and the page redraws where it was, with the
// answer in a toast, instead of jumping to the top on a redirect. Without
// JavaScript every form still posts and redirects as before.
(function () {
  var toast = document.getElementById("toast");
  function say(text, isError) {
    if (!toast || !text) return;
    toast.textContent = text;
    toast.classList.toggle("is-error", !!isError);
    toast.hidden = false;
    clearTimeout(say.timer);
    say.timer = setTimeout(function () { toast.hidden = true; }, isError ? 9000 : 5000);
  }
  try {
    var carried = sessionStorage.getItem("dss-notice");
    if (carried) {
      sessionStorage.removeItem("dss-notice");
      say(carried);
      var y = +sessionStorage.getItem("dss-scroll");
      sessionStorage.removeItem("dss-scroll");
      if (y) window.scrollTo(0, y);
    }
  } catch (e) {}

  function closeField(field) {
    field.classList.remove("editing");
    var form = field.querySelector(".field-edit");
    if (form) { form.hidden = true; form.reset(); }
    var err = field.querySelector(".field-error");
    if (err) err.hidden = true;
  }
  document.querySelectorAll("[data-edit]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var field = btn.closest("[data-field]");
      document.querySelectorAll("[data-field].editing").forEach(closeField);
      field.classList.add("editing");
      var form = field.querySelector(".field-edit");
      form.hidden = false;
      var first = form.querySelector("input:not([type=hidden]),select,textarea");
      if (first) { first.focus(); if (first.select && first.type !== "number") first.select(); }
    });
  });
  document.querySelectorAll(".field-edit").forEach(function (form) {
    var field = form.closest("[data-field]");
    form.querySelector("[data-cancel]").addEventListener("click", function () { closeField(field); });
    form.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.preventDefault(); closeField(field); }
      if (e.key === "Enter" && e.target.tagName === "TEXTAREA" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault(); form.requestSubmit();
      }
    });
  });

  // askFirst is confirm() in the page's own look: a dialog with the question,
  // Cancel, and a button that says what it does.
  var asker = document.createElement("dialog");
  asker.className = "dialog";
  asker.innerHTML = '<p class="ask-text"></p><div class="dialog-actions">' +
    '<button type="button" class="ghost" value="no">Cancel</button>' +
    '<button type="button" value="yes">Go ahead</button></div>';
  document.body.appendChild(asker);
  function askFirst(text, dangerous) {
    asker.querySelector(".ask-text").textContent = text;
    var yes = asker.querySelector('[value=yes]');
    yes.className = dangerous ? "danger-solid" : "";
    return new Promise(function (resolve) {
      function done(answer) {
        asker.querySelectorAll("button").forEach(function (b) { b.onclick = null; });
        asker.onclose = null;
        if (asker.open) asker.close();
        resolve(answer);
      }
      asker.querySelector('[value=no]').onclick = function () { done(false); };
      yes.onclick = function () { done(true); };
      asker.onclose = function () { done(false); };
      asker.showModal();
      yes.focus();
    });
  }

  document.addEventListener("submit", function (e) {
    var form = e.target;
    if (!form.hasAttribute("data-async") || e.defaultPrevented) return;
    e.preventDefault();
    var submitter = e.submitter;
    var ask = (submitter && submitter.getAttribute("data-confirm")) || form.getAttribute("data-confirm");
    var box = form.querySelector(".member-name");
    var who = form.getAttribute("data-person-name") || (box && box.value) || "them";
    // Anyone already on the event is moved, not added, and the question
    // says so, with what happens to a place given up.
    var choice = submitter && submitter.getAttribute("data-choice");
    if (ask && choice && choice !== "invite" && form.hasAttribute("data-standings")) {
      var standings = JSON.parse(form.getAttribute("data-standings"));
      var regularBox = form.querySelector("input[data-regular]");
      if (regularBox && regularBox.checked) {
        ask = "Make " + who + (standings.length === 1 ? " a regular" : " regulars") +
          ", with a place on every date, and put " + (standings.length === 1 ? "them" : "them all") +
          " down as going now? They are not asked first; each gets a DM saying so.";
      }
      // Only someone on a different list is moved; someone already on the
      // chosen one stays where they are.
      var moved = standings.filter(function (p) { return p.standing && p.standing !== "withdrawn" && p.standing !== choice; });
      if (moved.length) {
        ask += " " + moved.map(function (p) { return p.name + " moves off " + listWord[p.standing]; }).join("; ") + "." +
          (moved.some(function (p) { return p.standing === "attending"; }) && form.hasAttribute("data-place-frees")

    }
    // The answer is marked on the button pressed, or on the form when Enter
    // sent it, and the submit is sent again once it is yes.

    var fieldError = form.querySelector(".field-error");

      .catch(function (err) {

  });

  // Add someone: each pick joins a list under the search box, with a ✕ to
  // take it off again, and the actions appear once anyone is picked. What
  // an action would do to someone already on the event is said under it.

  var standing = { attending: "already going", waitlisted: "already on the waitlist",

  function joinNames(names) {

  }

    var list = form.querySelector("[data-picked-list]");
    var actions = form.querySelector("[data-actions]");
    var hint = form.querySelector("[data-empty-hint]");
    var box = form.querySelector(".member-name");
    var scratch = form.querySelector("[data-picker-id]");
    var people = [];

    // Each panel says only what is about it, and only when it matters.
    function setNote(el, text) { el.textContent = text; el.hidden = !text; }
    function refresh() {
      var n = people.length;
      actions.hidden = n === 0;
      hint.hidden = n > 0;
      var names = people.map(function (p) { return p.name; });
      if (n) form.setAttribute("data-person-name", joinNames(names));
      else form.removeAttribute("data-person-name");

        el.textContent = n === 1 ? names[0] : n + " people";
      });

      // Ask: an invite skips anyone already going or waiting — they have
      // answered already.
      var answered = people.filter(function (p) { return p.standing === "attending" || p.standing === "waitlisted"; });
      var askable = n - answered.length;
      form.querySelector("[data-invites]").textContent = askable > 1 ? askable + " invites" : "invite";
      form.querySelector("[data-choice=invite]").disabled = n > 0 && askable === 0;
      var reserve = form.querySelector("input[name=reserve]");
      if (reserve) {
        reserve.disabled = askable === 0;
        if (reserve.disabled) reserve.checked = false;
        var holdNote = form.querySelector("[data-hold-note]");
        if (holdNote) {
          var free = +reserve.getAttribute("data-free");

            ? "Only " + free + " place" + (free === 1 ? " is" : "s are") + " free: the first " + free +

            : "");
        }
      }
      setNote(form.querySelector("[data-ask-note]"), !answered.length ? "" :
        joinNames(answered.map(function (p) { return p.name; })) + (answered.length === 1 ? " is" : " are") +
        " already on the event" + (askable ? ", so the invite skips " + (answered.length === 1 ? "them." : "them.") : ": there is nobody to ask."));

      // Add yourself: a list that would change nobody is off; a regular goes
      // with Going only; someone already on the event is moved.
      var regularBox = form.querySelector("input[data-regular]");
      var makingRegular = !!(regularBox && regularBox.checked);
      form.querySelectorAll(".seg[data-choice]").forEach(function (b) {
        var choice = b.getAttribute("data-choice");
        var nobody = n > 0 && people.every(function (p) { return p.standing === choice; });
        b.disabled = b.hasAttribute("data-never") || (nobody && !(makingRegular && choice === "attending")) ||
          (makingRegular && choice !== "attending");
      });
      var on = people.filter(function (p) { return p.standing && p.standing !== "withdrawn"; });
      var forceNote = makingRegular ? "A regular is put on as going, so only Going applies." : "";
      form.setAttribute("data-standings", JSON.stringify(people.map(function (p) { return { name: p.name, standing: p.standing }; })));
      if (on.length) {
        if (!makingRegular) {
          forceNote = on.map(function (p) { return p.name + " is " + standing[p.standing]; }).join("; ") +
            ". Picking another list moves them.";
        }
      }
      setNote(form.querySelector("[data-force-note]"), forceNote);
    }

      sub.textContent = m.pasted ? "Pasted id · checked against the server when you go ahead"

          ((" " + (form.getAttribute("data-invited") || "") + " ").indexOf(" " + m.user_id + " ") >= 0
            ? "invited, no answer yet" : "not on this event yet"));
      text.appendChild(nameEl); text.appendChild(sub);
      var id = document.createElement("input");
      id.type = "hidden"; id.name = "discord_user_id"; id.value = m.user_id;
      var drop = document.createElement("button");
      drop.type = "button"; drop.className = "icon-btn"; drop.title = "Take " + name + " off this list";
      drop.setAttribute("aria-label", "Take " + name + " off this list");
      drop.innerHTML = '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      drop.addEventListener("click", function () {

        refresh(); box.focus();
      });

      list.appendChild(li);
      refresh();
      box.focus();
    });
  });

  // A location box: Find on Google Maps searches what is typed, and the
  // map under it shows what those words find, as they are typed. A pasted
  // Google Maps link is a pin already; the embed cannot show a short link,
  // so the preview hides and the link is kept as the location.
  document.querySelectorAll("[data-location]").forEach(function (wrap) {
    var input = wrap.querySelector("input[name=location]");
    var search = wrap.querySelector("[data-map-search]");
    var preview = wrap.querySelector("[data-map-preview]");
    var timer = null;
    function isLink(v) { return /^https:\/\/(\S*google\.\S*\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)/.test(v); }
    function update() {
      var v = input.value.trim();
      search.href = isLink(v) ? v : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v);

      timer = setTimeout(function () {
        preview.src = "https://maps.google.com/maps?output=embed&z=15&q=" + encodeURIComponent(v);

    }

    // would load Google for people who never touch the place.
    var field = wrap.closest("[data-field]");
    if (field) {
      field.querySelector("[data-edit]").addEventListener("click", update);
    } else {
      update();
    }
  });

  document.querySelectorAll("[data-open-dialog]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var d = document.getElementById(btn.getAttribute("data-open-dialog"));
      d.showModal();
      var input = d.querySelector("input:not([type=hidden])");
      if (input) input.focus();
    });
  });
  document.querySelectorAll("[data-close-dialog]").forEach(function (btn) {
    btn.addEventListener("click", function () { btn.closest("dialog").close(); });
  });

  // One name open at a time, and a click anywhere else closes it.
  document.addEventListener("click", function (e) {
    document.querySelectorAll("details.aka[open]").forEach(function (d) {
      if (!d.contains(e.target)) d.open = false;
    });
  });
})();
</script>
</body></html>{{end}}
