{{define "layout"}}<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · Events</title>
<style>
:root{--bg:#1a1b1e;--panel:#25262b;--line:#33353b;--ink:#e8e9ed;--dim:#9a9ca3;
      --accent:#5865f2;--ok:#2eb872;--warn:#e8a33d;--bad:#e05260}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:#9aa4ff;text-decoration:none}a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;
       align-items:center;gap:14px;background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
header .spacer{flex:1}
main{max-width:900px;margin:0 auto;padding:26px 20px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--dim);font-size:13px}
.row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;
      border:1px solid var(--line);color:var(--dim)}
.pill.open{color:var(--ok);border-color:#2eb87255}
.pill.closed{color:var(--warn);border-color:#e8a33d55}
.pill.cancelled{color:var(--bad);border-color:#e0526055}
.pill.completed{color:var(--dim)}
/* Archived cards stay legible but visibly done — dimmed, not hidden, because
   the roster of a past event is exactly what gets looked up later. */
.card.faded{opacity:.62}
.card.faded:hover{opacity:1}
details.archive{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
details.archive summary{cursor:pointer;color:var(--dim);font-size:14px;
  list-style:none;user-select:none;padding:6px 0}
details.archive summary::-webkit-details-marker{display:none}
details.archive summary::before{content:"▸ ";color:var(--dim)}
details.archive[open] summary::before{content:"▾ "}
details.archive summary:hover{color:var(--ink)}
.pill.discord{color:#9aa4ff;border-color:#5865f255}
label{display:block;margin:14px 0 5px;font-size:13px;color:var(--dim)}
input,select,textarea{width:100%;background:#1e1f23;border:1px solid var(--line);
      color:var(--ink);border-radius:7px;padding:9px 11px;font:inherit}
textarea{min-height:80px;resize:vertical}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;
      padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.danger{background:transparent;border:1px solid #e0526055;color:var(--bad)}
button:hover{filter:brightness(1.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.hint{color:var(--dim);font-size:12px;margin-top:5px}
.err{background:#e0526018;border:1px solid #e0526055;color:#ffb3bb;
     padding:11px 14px;border-radius:8px;margin-bottom:16px}
.ok{background:#2eb87218;border:1px solid #2eb87255;color:#a5e8c4;
    padding:11px 14px;border-radius:8px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--dim)}
.count{font-variant-numeric:tabular-nums}
</style></head><body>
<header>
  <h1><a href="/" style="color:inherit">Events</a></h1>
  <span class="spacer"></span>
  {{if .Session}}<span class="meta">{{.Session.DisplayName}}</span>
    <form method="post" action="/logout" style="margin:0"><button class="ghost">Sign out</button></form>
  {{else}}<a class="btn" href="/login">Sign in with Discord</a>{{end}}
</header>
<main>
{{if .Error}}<div class="err">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="ok">{{.Notice}}</div>{{end}}
{{template "content" .}}
</main>
<script>
// Rewrite every server-rendered UTC timestamp into the reader's own timezone.
// Intl.DateTimeFormat with an undefined locale uses the browser's settings, so
// this needs no timezone detection, no cookie and no round trip.
(function () {
  var fmt = new Intl.DateTimeFormat(undefined, {
    weekday: "short", day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", timeZoneName: "short"
  });
  document.querySelectorAll("time.ts").forEach(function (el) {
    var when = new Date(el.getAttribute("datetime"));
    if (isNaN(when.getTime())) return;   // leave the UTC fallback in place
    el.title = "UTC: " + el.getAttribute("datetime");
    el.textContent = fmt.format(when);
  });
})();
</script>
</body></html>{{end}}
